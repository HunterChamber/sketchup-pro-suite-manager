<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1e33"/>
      <stop offset="55%" stop-color="#102b46"/>
      <stop offset="100%" stop-color="#0a1826"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff5f1f"/>
    </linearGradient>
    <linearGradient id="cubeShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c94f10"/>
      <stop offset="100%" stop-color="#8f3608"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a30" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7a30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headTxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd9b0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- blueprint grid -->
  <g stroke="#2c4a68" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="220" y1="0" x2="220" y2="360"/>
    <line x1="340" y1="0" x2="340" y2="360"/>
    <line x1="460" y1="0" x2="460" y2="360"/>
    <line x1="580" y1="0" x2="580" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="820" y1="0" x2="820" y2="360"/>
    <line x1="940" y1="0" x2="940" y2="360"/>
    <line x1="1060" y1="0" x2="1060" y2="360"/>
  </g>

  <!-- glow behind cube cluster -->
  <circle cx="960" cy="180" r="220" fill="url(#glow)"/>

  <!-- isometric cube stack (3D modeling motif) -->
  <g transform="translate(860,120)">
    <polygon points="120,0 200,42 120,84 40,42" fill="url(#cube)"/>
    <polygon points="40,42 120,84 120,164 40,122" fill="url(#cubeShade)"/>
    <polygon points="200,42 120,84 120,164 200,122" fill="#e3690f"/>
    <line x1="40" y1="42" x2="120" y2="0" stroke="#ffdcb0" stroke-width="1.2" opacity="0.6"/>
    <line x1="200" y1="42" x2="120" y2="0" stroke="#ffdcb0" stroke-width="1.2" opacity="0.6"/>
  </g>

  <g transform="translate(760,205)" opacity="0.85">
    <polygon points="80,0 130,26 80,52 30,26" fill="#ffb066"/>
    <polygon points="30,26 80,52 80,96 30,70" fill="#b04a12"/>
    <polygon points="130,26 80,52 80,96 130,70" fill="#d4630f"/>
  </g>

  <!-- thin orange construction lines -->
  <g stroke="#ff7a30" stroke-width="1.5" opacity="0.55">
    <line x1="700" y1="60" x2="1140" y2="60"/>
    <line x1="700" y1="300" x2="1140" y2="300"/>
    <line x1="1140" y1="60" x2="1140" y2="300"/>
  </g>

  <!-- corner accent triangle -->
  <polygon points="0,360 0,260 140,360" fill="#ff5f1f" opacity="0.12"/>
  <polygon points="0,360 0,300 70,360" fill="#ff7a30" opacity="0.25"/>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="72" fill="url(#headTxt)">
    <tspan x="60" y="150" textLength="620" lengthAdjust="spacingAndGlyphs">SketchUp Pro</tspan>
    <tspan x="60" y="232" textLength="820" lengthAdjust="spacingAndGlyphs">Full Version Download</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="285" font-family="'Segoe UI', Arial, sans-serif" fill="#bcd4e8" textLength="1080.0" lengthAdjust="spacingAndGlyphs" font-size="15.8">I can't help create a description promoting "full version" downloads of paid commercial software like SketchU…</text>

  <!-- baseline accent -->
  <line x1="60" y1="300" x2="380" y2="300" stroke="#ff7a30" stroke-width="3"/>
</svg>